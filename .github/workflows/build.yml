name: Build

on:
  push:
    branches: ["mur-voir/main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Cellular soak duration in seconds
        type: choice
        options: ["120", "960"]
        default: "120"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Verify dashboard
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.12
      - run: npm ci
      - run: npm run check-format
      - run: npm run typecheck
      - name: Run dashboard unit tests
        run: npm test
      - name: Run telemetry backend unit tests
        run: node --test tools/mock-backend/test/*.test.ts
      - run: npx tsc -p tools/mock-backend
      - run: npm run compile
      - run: npm run wasm:compile
      - run: npx playwright install --with-deps chromium
      - name: Exercise the cellular API in Electron
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '120' }}
        run: xvfb-run -a npm run cellular-smoke -- --soak-seconds "$SOAK_SECONDS" --retention-seconds 330
        timeout-minutes: 20
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-bundles
          path: bundles/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cellular-verification
          path: .screenshots/cellular/
          retention-days: 7

  lite:
    name: Verify and package Lite
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run lite-build
      - run: npx playwright install --with-deps chromium
      - run: npm run lite-smoke -- --skip-build
        timeout-minutes: 5
      - name: Package standalone Lite
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist/lite/lite dist/lite/tools/lite-serve
          cp -rL lite/static dist/lite/lite/static
          cp tools/lite-serve/main.mjs dist/lite/tools/lite-serve/
          cp LICENSE ThirdPartyLicenses.txt dist/lite/
          cp docs/cellular-telemetry.md dist/lite/README.md
          cd dist/lite
          zip -qr ../mur-voir-lite-${VERSION}.zip .
      - name: Verify standalone Lite archive
        run: |
          VERSION=$(node -p "require('./package.json').version")
          unzip -q "dist/mur-voir-lite-${VERSION}.zip" -d dist/lite-check
          LITE_SMOKE_SERVER=dist/lite-check/tools/lite-serve/main.mjs npm run lite-smoke -- --skip-build
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        with:
          name: mur-voir-lite
          path: dist/mur-voir-lite-*.zip
          retention-days: 1

  desktop:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: blacksmith-6vcpu-macos-15, os: mac, arch: arm64 }
          - { runner: blacksmith-6vcpu-macos-15, os: mac, arch: x64 }
          - { runner: blacksmith-2vcpu-windows-2025, os: win, arch: x64 }
          - { runner: blacksmith-2vcpu-windows-2025, os: win, arch: arm64 }
          - { runner: blacksmith-2vcpu-ubuntu-2404, os: linux, arch: x64 }
          - { runner: blacksmith-2vcpu-ubuntu-2404, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: desktop-bundles
          path: bundles
      - name: Build installer
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "linux" ]; then
            npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never
          else
            npx electron-builder --${{ matrix.os }} --${{ matrix.arch }} --publish never
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_7Z_FILTER: BCJ
      - name: Verify macOS disk image
        if: matrix.os == 'mac'
        run: hdiutil verify dist/*.dmg
      - name: Exercise packaged macOS app
        if: matrix.os == 'mac' && matrix.arch == 'arm64'
        run: npm run cellular-smoke -- --executable dist/mac-arm64/mur-voir.app/Contents/MacOS/mur-voir --out .screenshots/packaged
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        if: always() && matrix.os == 'mac' && matrix.arch == 'arm64'
        with:
          name: packaged-verification-mac-arm64
          path: .screenshots/packaged/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: mur-voir-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/mur-voir-*.dmg
            dist/mur-voir-*.exe
            dist/mur-voir-*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish mur-voir release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, lite, desktop]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f "docs/release-notes/$VERSION.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: mur-voir-*
          path: release-assets
          merge-multiple: true
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "mur-voir $VERSION" --notes-file "docs/release-notes/$VERSION.md" --latest
      - name: Verify published downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir published-assets
          cd published-assets
          sha256sum --check SHA256SUMS.txt
