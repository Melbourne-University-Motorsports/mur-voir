name: Claude (jjkg07)

# Runs Claude Code when jjkg07 mentions @claude, billed to jjkg07's Claude
# subscription. Mentions from anyone else skip this workflow.
#
# To use your own subscription: copy this file to claude-<your-login>.yml,
# replace jjkg07 with your login, run `claude setup-token`, and ask a repo
# admin to save the token as CLAUDE_CODE_OAUTH_TOKEN_<YOUR_LOGIN>.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == 'jjkg07' && github.triggering_actor == 'jjkg07' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_JJKG07 }}
