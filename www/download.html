<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="download.css" />
    <link rel="stylesheet" href="loadingAnimation.css" />
    <link rel="stylesheet" href="mur-theme.css" />
    <script type="module" src="../bundles/download.js"></script>
    <title>Download Runs &mdash; mur-voir</title>
  </head>

  <body>
    <div class="file-list">
      <div class="runs" role="listbox" aria-multiselectable="true" aria-label="Runs"></div>
      <div class="loading">
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
        <div class="loading-bar"></div>
      </div>
    </div>

    <div class="fault-list" hidden></div>

    <select class="filter" title="Show runs">
      <option value="all">All</option>
      <option value="driving">Driving</option>
      <option value="parked">Parked</option>
    </select>
    <div class="alert-text"></div>
    <progress min="0" max="1" hidden></progress>
    <div class="progress-details" hidden></div>

    <button id="open" title="Open" disabled>
      <img src="symbols/input.svg" />
    </button>
    <button id="download" title="Download" disabled>
      <img src="symbols/download.svg" />
    </button>
    <button id="copy-link" title="Copy a link to this run" disabled>
      <img src="symbols/link.svg" />
    </button>
    <button id="exit" title="Close">
      <img src="symbols/close.svg" />
    </button>

    <div class="scrim" hidden>
      <div class="dialog" role="alertdialog" aria-labelledby="dialog-title">
        <div class="dialog-title" id="dialog-title">Live telemetry is on</div>
        <p class="dialog-text"></p>
        <div class="dialog-buttons"></div>
      </div>
    </div>
  </body>
</html>
