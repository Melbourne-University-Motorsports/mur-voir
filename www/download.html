<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="download.css" />
    <script type="module" src="../bundles/download.js"></script>
    <title>Download Runs &mdash; mur-voir</title>
  </head>

  <body>
    <div class="header">
      <span class="heading">Download runs</span>
      <span class="filters" role="radiogroup" aria-label="Show runs">
        <button data-filter="all" role="radio">All</button>
        <button data-filter="driving" role="radio">Driving</button>
        <button data-filter="parked" role="radio">Parked</button>
      </span>
      <button class="close" title="Close">
        <img src="symbols/close.svg" />
      </button>
    </div>

    <div class="runs" role="listbox" aria-multiselectable="true" aria-label="Runs"></div>

    <div class="footer">
      <div class="what"></div>
      <button class="action copy-link" disabled>Copy link</button>
      <button class="action download" disabled>Download</button>
      <button class="action open primary" disabled>Open</button>
      <div class="fault-list" hidden></div>
    </div>

    <div class="scrim" hidden>
      <div class="dialog" role="alertdialog" aria-labelledby="dialog-title">
        <div class="dialog-title" id="dialog-title">Live telemetry is on</div>
        <p class="dialog-text"></p>
        <div class="dialog-buttons"></div>
      </div>
    </div>

    <div class="toast" role="status" hidden></div>
  </body>
</html>
